name: TUM RGB-D benchmark smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-smoke.yml"
      - "src/**"
      - "tools/**"
      - "configs/**"
      - "pyproject.toml"

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Download TUM fr3/walking_xyz
        run: |
          mkdir -p data
          curl -L --fail --retry 3 \
            "https://webshare.cvg.cit.tum.de/g/rgbd/dataset/freiburg3/rgbd_dataset_freiburg3_walking_xyz.tgz" \
            -o /tmp/fr3_walking_xyz.tgz
          tar -xzf /tmp/fr3_walking_xyz.tgz -C data
          test -f data/rgbd_dataset_freiburg3_walking_xyz/rgb.txt
          test -f data/rgbd_dataset_freiburg3_walking_xyz/depth.txt
          test -f data/rgbd_dataset_freiburg3_walking_xyz/groundtruth.txt

      - name: Build associations
        run: |
          python tools/make_associations.py \
            --rgb data/rgbd_dataset_freiburg3_walking_xyz/rgb.txt \
            --depth data/rgbd_dataset_freiburg3_walking_xyz/depth.txt \
            --output data/rgbd_dataset_freiburg3_walking_xyz/associations.txt

      - name: Build filtered semantic map
        run: |
          python tools/build_semantic_map.py \
            --config configs/tum_fr3_walking.yaml \
            --dataset data/rgbd_dataset_freiburg3_walking_xyz \
            --poses data/rgbd_dataset_freiburg3_walking_xyz/groundtruth.txt \
            --output results/groundtruth_filtered_smoke \
            --filter-dynamic \
            --frame-step 15 \
            --preview-count 4

      - name: Build unfiltered semantic map
        run: |
          python tools/build_semantic_map.py \
            --config configs/tum_fr3_walking.yaml \
            --dataset data/rgbd_dataset_freiburg3_walking_xyz \
            --poses data/rgbd_dataset_freiburg3_walking_xyz/groundtruth.txt \
            --output results/groundtruth_unfiltered_smoke \
            --frame-step 15

      - name: Compare filtered and unfiltered maps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          filtered = json.loads(Path("results/groundtruth_filtered_smoke/run_metadata.json").read_text())
          unfiltered = json.loads(Path("results/groundtruth_unfiltered_smoke/run_metadata.json").read_text())

          comparison = {
              "filtered_raw_points": filtered["raw_points"],
              "unfiltered_raw_points": unfiltered["raw_points"],
              "raw_points_removed": unfiltered["raw_points"] - filtered["raw_points"],
              "raw_points_removed_percent": round(
                  100.0 * (unfiltered["raw_points"] - filtered["raw_points"]) / unfiltered["raw_points"], 3
              ) if unfiltered["raw_points"] else 0.0,
              "filtered_downsampled_points": filtered["downsampled_points"],
              "unfiltered_downsampled_points": unfiltered["downsampled_points"],
              "filtered_object_observations": filtered["object_observations"],
              "unfiltered_object_observations": unfiltered["object_observations"],
              "processed_frames": filtered["processed_frames"],
          }
          Path("results/comparison.json").write_text(json.dumps(comparison, indent=2))
          print(json.dumps(comparison, indent=2))
          PY

      - name: Render map previews
        run: |
          python tools/render_map_preview.py \
            --input results/groundtruth_filtered_smoke/semantic_map.ply \
            --output docs/images/tum_filtered_topdown.png \
            --title "Filtered semantic map (person pixels removed)"
          python tools/render_map_preview.py \
            --input results/groundtruth_unfiltered_smoke/semantic_map.ply \
            --output docs/images/tum_unfiltered_topdown.png \
            --title "Unfiltered semantic map"

      - name: Show run metadata
        run: |
          echo "Filtered:"
          cat results/groundtruth_filtered_smoke/run_metadata.json
          echo "Unfiltered:"
          cat results/groundtruth_unfiltered_smoke/run_metadata.json
          echo "Comparison:"
          cat results/comparison.json

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tum-fr3-walking-xyz-semantic-map-comparison
          path: |
            results/groundtruth_filtered_smoke/**
            results/groundtruth_unfiltered_smoke/**
            results/comparison.json
            docs/images/tum_filtered_topdown.png
            docs/images/tum_unfiltered_topdown.png
            results/groundtruth_filtered_smoke/previews/**
          retention-days: 14
